<html>
	<head>
		<title>Table Creating</title>
	</head>
	<body>
		<table border = "1" width = "100%" height = "100%">
			<tr>
				<th bgcolor = "orange">1</th>
				<th colspan = "2" bgcolor = "brown">2</th>
			</tr>
			<tr>
				<td bgcolor = "lime">4</td>
				<td bgcolor = "aqua">5</td>
				<td bgcolor = "red">6</td>
			</tr>
			<tr>
				<td bgcolor = "cyan">7</td>
				<td bgcolor = "yellow">8</td>
				<td bgcolor = "royal blue">9</td>
			</tr>
		</table>
	</body>
</html>
